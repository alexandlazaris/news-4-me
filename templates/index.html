<!DOCTYPE html>
<html>

<head>
    <title>News 4 me</title>

    <style>
        /* Overall page */
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #121212;
            color: #f1f1f1;
        }

        /* Main heading */
        h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 35px;
        }

        /* Category sections */
        .category {
            margin-bottom: 40px;
            background-color: #1c1c1c;
            padding: 20px;
            border-radius: 10px;
        }

        /* Category heading */
        .category h2 {
            color: #ffffff;
            font-size: 21px;
            border-bottom: 1px solid #383838;
            padding-bottom: 12px;
            margin-top: 0;
        }

        /* Results list */
        .results {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Individual result */
        .result-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid #333333;
        }

        /* Remove last divider */
        .result-item:last-child {
            border-bottom: none;
        }

        /* Result image */
        .result-item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        /* Result content */
        .result-content {
            flex: 1;
        }

        .result-content h3 {
            color: #f5f5f5;
            font-size: 17px;
            margin: 0 0 8px;
        }

        .result-content p {
            color: #aaaaaa;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        /* Empty state */
        .empty-state {
            padding: 20px;
            color: #999999;
            background-color: #252525;
            border-radius: 8px;
            font-size: 14px;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            body {
                margin: 20px auto;
                padding: 0 12px;
            }

            .category {
                padding: 15px;
            }

            .result-item {
                gap: 12px;
            }

            .result-item img {
                width: 90px;
                height: 75px;
            }
        }
    </style>
</head>

<body>
    <h1>News 4 me</h1>
    {% if results %}
    <ul class="results">
        {% for item in results %}
        <li class="result-item">
            {% if item.urlToImage %}
            <img src="{{ item.urlToImage }}" width="100px" height="100px" alt="{{item.title}}">
            {% endif %}
            <div class="result-content">
                <h3>{{ item.title }}</h3>
                <h5>{{ item.description }}</h5>
                <p>{{ item.content }}</p>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <div class="empty-state">
        <h3>No results found</h3>
        <p>There are currently no results to display.</p>
    </div>
    {% endif %}
</body>

</html>
